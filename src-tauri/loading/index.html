<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM Monitor</title>
<style>
  /* cores do brand.generated.json (fundo claro/escuro) */
  :root { color-scheme: light dark; --bg: #f0f6f9; --fg: #0b2a33; --muted: #5b7680; }
  @media (prefers-color-scheme: dark) { :root { --bg: #051216; --fg: #e6f2f5; --muted: #8aa4ac; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { height: 100%; display: grid; place-content: center; justify-items: center; gap: 16px; text-align: center; padding: 0 24px; }
  img { width: 72px; height: 72px; }
  .spin { width: 22px; height: 22px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  #status { color: var(--muted); font-size: 13px; max-width: 46ch; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="" />
  <strong>LLM Monitor</strong>
  <div class="spin" aria-hidden="true"></div>
  <p id="status">Subindo o server…</p>
</main>
</body>
</html>
